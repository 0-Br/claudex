# claudex 的唯一配置文件：来源、每个来源挑选的模型、profile 与全局选项。
# 下面的来源名、模型 id 与 OpenRouter slug 都是示例，换成你自己的再用。

# 不写 --profile 或 @名字 时启动的 profile
default_profile = "daily"

# 会话里屏蔽的 MCP 工具（通配符形式），缺省不屏蔽；启动时加 --with-mcp 可本次放开
# mcp_deny = ["mcp__github__*"]

# 自动压缩窗口 = 四档中最小的 context × 本系数，缺省 0.95
# compact_window_factor = 0.95

# 订阅来源：先运行 claudex login codex 登录
[sources.sub]
type = "codex"
models = ["model-a"]

# OpenRouter 来源：模型 id 就是 OpenRouter slug；key 用 claudex key set or 写入
[sources.or]
type = "openrouter"
models = ["vendor/model-c", "vendor/model-d"]

# 以 Anthropic 兼容接口提供的套餐；context 与 efforts 可以显式写
# [sources.plan]
# type = "anthropic"
# base_url = "https://example.invalid/anthropic"
# models = [{ id = "model-e", context = 256000, efforts = ["low", "high"] }]

[profiles.daily]
fable = "or/vendor/model-d"
opus = "sub/model-a"
sonnet = "or/vendor/model-c"
haiku = "or/vendor/model-c"
