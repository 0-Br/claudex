[project]
name = "claudex"
dynamic = ["version"]
description = "以专用 settings 启动 Claude Code，把模型请求经本机 CLIProxyAPI 网关转到按 profile 选定的后端"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudex"]

# 两个 bash 命令原样装进环境的 bin/：启动器按自身解析后的位置找到同一环境的
# python，key 读取命令供 Claude Code 的 apiKeyHelper 与其他工具调用。
[tool.hatch.build.targets.wheel.shared-scripts]
"bin/claudex" = "claudex"
"bin/claudex-client-key" = "claudex-client-key"

# 类型检查：standard 档，源码包与测试都在检查面内，零诊断。解释器不写在这里，
# 运行时用 --pythonpath 指向项目环境。
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
